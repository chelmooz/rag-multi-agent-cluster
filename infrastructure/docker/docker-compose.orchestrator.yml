# Stack Docker du LXC Master — Machine 1 (LXC 100).
# Orchestrator + API + Wiki Agent + LangGraph
# Note : pas de reverse proxy nginx (décision D9) — pfSense (VM 104) gère le proxy.
name: rag-orchestrator

services:
  fastapi-api:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.api
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 1g
    env_file:
      - ../../.env
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - QDRANT_API_KEY=${QDRANT_API_KEY}
    volumes:
      - /data/shared:/data/shared:rw
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  langgraph-orchestrator:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.langgraph
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 2g
    env_file:
      - ../../.env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - QDRANT_API_KEY=${QDRANT_API_KEY}
    volumes:
      - /data/shared:/data/shared:rw

  wiki-agent:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.wiki-agent
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 512m
    env_file:
      - ../../.env
    volumes:
      - wiki-data:/data/wiki
      - raw-data:/data/raw
      - index-data:/data/index
      - /data/shared:/data/shared:rw
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - WIKI_ROOT=/data/wiki
      - RAW_ROOT=/data/raw

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 256m
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  wiki-data:
  raw-data:
  index-data:
  redis-data:
  postgres-data: