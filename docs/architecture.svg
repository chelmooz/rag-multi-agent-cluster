<svg width="100%" viewBox="0 0 880 1560" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Architecture RAG avec couche multi-agents, mapping Cluster et Frontend Obsidian (pattern Karpathy)</title>
  <desc>Après génération, deux agents (juge LLM et avocat du diable) évaluent la réponse en parallèle avant synthèse par l'évaluateur. Le tout est piloté par un Vault Obsidian (pattern Karpathy) connecté au cluster Proxmox + BC250.</desc>
  
  <defs>
    <!-- Flèche originale -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#666666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <!-- Flèches colorées pour le mapping cluster -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#f97316" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ========================================== -->
  <!-- Frontend : Obsidian Vault (pattern Karpathy) -->
  <!-- ========================================== -->
  <g id="frontend-obsidian">
    <rect x="260" y="320" width="160" height="60" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
    <text x="340" y="346" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000" font-family="system-ui, sans-serif">Obsidian</text>
    <text x="340" y="366" text-anchor="middle" font-size="12" fill="#000000" font-family="system-ui, sans-serif">Vault Markdown</text>
    
    <!-- Liaison vers la Requête -->
    <line x1="340" y1="380" x2="340" y2="400" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
    
    <!-- Liaison de retour depuis la Réponse finale (boucle) -->
    <path d="M440 1488 L650 1488 L650 350 L420 350" fill="none" stroke="#666666" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  </g>

  <!-- ========================================== -->
  <!-- MAPPING INFRASTRUCTURE CLUSTER             -->
  <!-- ========================================== -->
  <g id="cluster-mapping">
    <!-- Machine 1: Master -->
    <rect x="690" y="30" width="170" height="550" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2" rx="8" stroke-dasharray="5,5"/>
    <text x="775" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0369a1">Machine 1: Master</text>
    <text x="775" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#0284c7">Xeon 2699 + 32GB ECC</text>
    <text x="775" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#0369a1">LXC 100: Orchestrator</text>
    <text x="775" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#0369a1">LXC 101: Vector DB</text>
    
    <!-- Machine 2: GPU Worker -->
    <rect x="690" y="600" width="170" height="450" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" rx="8" stroke-dasharray="5,5"/>
    <text x="775" y="625" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#15803d">Machine 2: GPU Worker</text>
    <text x="775" y="645" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#16a34a">Xeon 2698 + 64GB + RTX 4000</text>
    <text x="775" y="665" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#15803d">LXC 200: Inference GPU</text>
    <text x="775" y="685" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#15803d">LXC 201: Workers Agents</text>

    <!-- Machine 3: BC250 Baremetal -->
    <rect x="690" y="1070" width="170" height="450" fill="#fff7ed" stroke="#f97316" stroke-width="2" rx="8" stroke-dasharray="5,5"/>
    <text x="775" y="1095" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#c2410c">Machine 3: BC250</text>
    <text x="775" y="1115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#ea580c">Baremetal Debian 12</text>
    <text x="775" y="1135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#c2410c">AMD BC250 + 12GB GPU</text>
    <text x="775" y="1155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#c2410c">(40 CUs activés)</text>

    <!-- Liaisons Machine 1 (Bleu) -->
    <line x1="690" y1="150" x2="500" y2="308" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-blue)"/>
    <line x1="690" y1="150" x2="430" y2="528" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-blue)"/>
    <line x1="690" y1="150" x2="230" y2="748" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-blue)"/>
    <line x1="690" y1="150" x2="430" y2="1368" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-blue)"/>

    <!-- Liaisons Machine 2 (Vert) -->
    <line x1="690" y1="700" x2="500" y2="208" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-green)"/>
    <line x1="690" y1="700" x2="440" y2="748" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-green)"/>
    <line x1="690" y1="700" x2="420" y2="908" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-green)"/>
    <line x1="690" y1="700" x2="430" y2="1128" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-green)"/>

    <!-- Liaisons Machine 3 (Orange) -->
    <line x1="690" y1="1200" x2="620" y2="748" stroke="#f97316" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-orange)"/>
    <line x1="690" y1="1200" x2="250" y2="1128" stroke="#f97316" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-orange)"/>

    <!-- Légende -->
    <g transform="translate(690, 1530)">
      <rect x="0" y="0" width="12" height="12" fill="#f0f9ff" stroke="#0ea5e9" rx="2"/>
      <text x="18" y="11" font-family="system-ui, sans-serif" font-size="11" fill="#0369a1">Machine 1 (Master)</text>
      
      <rect x="0" y="20" width="12" height="12" fill="#f0fdf4" stroke="#22c55e" rx="2"/>
      <text x="18" y="31" font-family="system-ui, sans-serif" font-size="11" fill="#15803d">Machine 2 (GPU LXC)</text>
      
      <rect x="0" y="40" width="12" height="12" fill="#fff7ed" stroke="#f97316" rx="2"/>
      <text x="18" y="51" font-family="system-ui, sans-serif" font-size="11" fill="#c2410c">Machine 3 (BC250)</text>
    </g>
  </g>

