<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <style><![CDATA[
      .title { font: 600 20px/1.3 "Inter", "JetBrains Mono", monospace; fill: #111827; }
      .subtitle { font: 400 12px/1.4 "Inter", sans-serif; fill: #6b7280; }
      .vlan-title { font: 600 13px/1.3 "Inter", sans-serif; fill: var(--vlan-color); }
      .node-title { font: 600 14px/1.3 "Inter", sans-serif; fill: var(--node-color); }
      .node-spec { font: 400 10.5px/1.35 "JetBrains Mono", monospace; fill: #1f2937; }
      .node-role { font: 500 10px/1.3 "Inter", sans-serif; fill: #374151; }
      .arrow-label { font: 500 9px/1.2 "JetBrains Mono", monospace; fill: var(--arrow-color); }
      .legend-title { font: 600 12px/1.3 "Inter", sans-serif; fill: #111827; }
      .legend-item { font: 400 10px/1.4 "Inter", sans-serif; fill: #374151; }
      .legend-swatch { fill: var(--swatch-color); }
      .vlan-bg { fill: none; stroke: var(--vlan-color); stroke-width: 1.5; stroke-dasharray: 6 3; }
      .node-bg { stroke: var(--node-color); stroke-width: 2; }
      .arrow { fill: none; stroke: var(--arrow-color); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-head { fill: var(--arrow-color); stroke: none; }
      .dashed { stroke-dasharray: 5 3; }
    ]]></style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="#fafafa"/>

  <!-- Title -->
  <text x="30" y="30" class="title">Topologie Réseau & Sécurité — Cluster RAG Multi-Agents Offline</text>
  <text x="30" y="54" class="subtitle">Grille 20px · Légende couleurs commune à tous les diagrammes · VLANs isolés · Backbone 10G Jumbo frames (MTU 9000)</text>

  <!-- ========== VLAN 20 - WAN (Top) ========== -->
  <g style="--vlan-color:#d97706;">
    <rect x="30" y="80" width="1140" height="140" class="vlan-bg" rx="4"/>
    <text x="45" y="95" class="vlan-title">VLAN 20 · WAN — 192.168.1.0/24 — pfSense → Internet (updates, modèles LLM)</text>

    <!-- Internet -->
    <g style="--node-color:#d97706;">
      <rect x="520" y="115" width="160" height="70" class="node-bg" fill="#fffbeb" rx="4"/>
      <text x="535" y="130" class="node-title">🌐 Internet</text>
      <text x="535" y="148" class="node-spec">Updates OS / Modèles LLM</text>
    </g>

    <!-- pfSense -->
    <g style="--node-color:#d97706;">
      <rect x="520" y="200" width="160" height="85" class="node-bg" fill="#fffbeb" rx="4"/>
      <text x="535" y="215" class="node-title">🛡️ pfSense Gateway</text>
      <text x="535" y="233" class="node-spec">VM M1 LXC 104 ou appliance</text>
      <text x="535" y="248" class="node-spec">Routes inter-VLAN + NAT sortant</text>
      <text x="535" y="263" class="node-spec">192.168.1.1 / 10.10.0.254</text>
    </g>

    <!-- Arrow Internet → pfSense -->
    <path d="M600 185V200" class="arrow" style="--arrow-color:#d97706;"/>
    <polygon points="600,200 595,190 605,190" class="arrow-head" style="--arrow-color:#d97706;"/>
  </g>

  <!-- ========== VLAN 40 - Client (Left Middle) & VLAN 30 - Mgmt (Right Middle) ========== -->
  <g style="--vlan-color:#2563eb;">
    <rect x="30" y="240" width="480" height="200" class="vlan-bg" rx="4"/>
    <text x="45" y="255" class="vlan-title">VLAN 40 · Client — 192.168.10.0/24</text>

    <g style="--node-color:#2563eb;">
      <rect x="60" y="285" width="420" height="130" class="node-bg" fill="#eff6ff" rx="4"/>
      <text x="75" y="300" class="node-title">📝 Client Obsidian</text>
      <text x="75" y="318" class="node-spec">Vault + Web Clipper → HTTPS 443</text>
      <text x="75" y="333" class="node-spec">DNS local → pfSense DNAT → LXC 102 (nginx)</text>
      <text x="75" y="348" class="node-spec">Graph View · Markdown local · 100% Offline</text>
    </g>
  </g>

  <g style="--vlan-color:#6b7280;">
    <rect x="690" y="240" width="480" height="200" class="vlan-bg" rx="4"/>
    <text x="705" y="255" class="vlan-title">VLAN 30 · Mgmt — 172.16.0.0/24</text>

    <g style="--node-color:#6b7280;">
      <rect x="720" y="285" width="420" height="130" class="node-bg" fill="#f9fafb" rx="4"/>
      <text x="735" y="300" class="node-title">🖥️ Admin / IPMI</text>
      <text x="735" y="318" class="node-spec">Proxmox GUI · SSH secours (1GbE dédié)</text>
      <text x="735" y="333" class="node-spec">M1, M2, M3 isolés — pas d'accès VLAN 10/40</text>
      <text x="735" y="348" class="node-spec">HTTPS 443 / SSH 22 uniquement</text>
    </g>
  </g>

  <!-- Arrows: Client → pfSense, Mgmt → pfSense -->
  <path d="M270 350L400 350L400 285" class="arrow dashed" style="--arrow-color:#2563eb;"/>
  <polygon points="400,285 390,295 410,295" class="arrow-head" style="--arrow-color:#2563eb;"/>
  <text x="270" y="325" class="arrow-label" style="--arrow-color:#2563eb;">TCP 443</text>

  <path d="M930 350L760 350L760 285" class="arrow dashed" style="--arrow-color:#6b7280;"/>
  <polygon points="760,285 770,295 750,295" class="arrow-head" style="--arrow-color:#6b7280;"/>
  <text x="800" y="325" class="arrow-label" style="--arrow-color:#6b7280;">HTTPS/SSH</text>

  <!-- Arrow: pfSense → Internet (NAT out) -->
  <path d="M600 200L600 185" class="arrow dashed" style="--arrow-color:#d97706;"/>
  <polygon points="600,185 590,195 610,195" class="arrow-head" style="--arrow-color:#d97706;"/>
  <text x="610" y="190" class="arrow-label" style="--arrow-color:#d97706;">NAT out</text>

  <!-- ========== VLAN 10 - Cluster Backbone (Large bottom section) ========== -->
  <g style="--vlan-color:#0ea5e9;">
    <rect x="30" y="460" width="1140" height="380" class="vlan-bg" rx="4"/>
    <text x="45" y="475" class="vlan-title">VLAN 10 · Cluster — 10.10.0.0/24 — Backbone 10GbE — MTU 9000 (Jumbo frames, +15% débit NFS/Ollama/Qdrant)</text>

    <!-- M1 Master -->
    <g style="--node-color:#0ea5e9;">
      <rect x="45" y="510" width="350" height="300" class="node-bg" fill="#f0f9ff" rx="4"/>
      <text x="60" y="525" class="node-title">🖥️ M1 — Master · 10.10.0.1</text>
      <text x="60" y="545" class="node-spec">2× Xeon E5-2699 v4 / 32 GB ECC</text>
      <text x="60" y="560" class="node-spec">RX 580 8GB (fallback léger uniquement)</text>
      <text x="60" y="578" class="node-role">LXC 100  Orchestrator + Wiki Agent  (LangGraph + FastAPI)</text>
      <text x="60" y="593" class="node-role">LXC 101  Qdrant VectorDB  (BM25 + Vectoriel 768d, port 6333)</text>
      <text x="60" y="608" class="node-role">LXC 102  API Gateway nginx  (TLS termination, port 443)</text>
      <text x="60" y="623" class="node-role">LXC 103  Monitoring  (Prometheus + Grafana + Loki)</text>
      <text x="60" y="638" class="node-role">LXC 104  pfSense VM  (option si pas d'appliance)</text>
      <text x="60" y="653" class="node-role">LXC 105  OMV Backup Live  (500 GB virtio, NFS/SMB)</text>
      <text x="60" y="670" class="node-spec">Export NFS /data/shared (rw,sync,no_root_squash)</text>
    </g>

    <!-- M2 GPU Worker -->
    <g style="--node-color:#22c55e;">
      <rect x="420" y="510" width="360" height="300" class="node-bg" fill="#f0fdf4" rx="4"/>
      <text x="435" y="525" class="node-title" style="--node-color:#22c55e;">🎮 M2 — GPU Worker · 10.10.0.2</text>
      <text x="435" y="545" class="node-spec">Xeon E5-2698 v4 / 64 GB ECC</text>
      <text x="435" y="560" class="node-spec">NVIDIA Quadro RTX 4000 (8 GB VRAM)</text>
      <text x="435" y="578" class="node-role">LXC 200  Inference GPU (passthrough) — Reranker bge-v2-m3 + Juge qwen3.5:7b</text>
      <text x="435" y="593" class="node-role">LXC 201  Workers Agents — Avocat mistral:7b + Backup Embedding CPU</text>
      <text x="435" y="608" class="node-spec">Mount NFS 10.10.0.1:/data/shared (_netdev)</text>
      <text x="435" y="623" class="node-spec">Ollama CUDA 11434 · Qdrant 6333 (replica)</text>
    </g>

    <!-- M3 BC-250 Baremetal -->
    <g style="--node-color:#f97316;">
      <rect x="805" y="510" width="365" height="300" class="node-bg" fill="#fff7ed" rx="4"/>
      <text x="820" y="525" class="node-title" style="--node-color:#f97316;">⚡ M3 — BC-250 Baremetal · 10.10.0.3</text>
      <text x="820" y="545" class="node-spec">Zen 2 6c/12t · 16 GB GDDR6 unifiée CPU+GPU</text>
      <text x="820" y="560" class="node-spec">40 CU débloquées · Vulkan/Mesa RADV (pas ROCm)</text>
      <text x="820" y="578" class="node-role">Générateur qwen3.5:14b/35b MoE · Text-to-SQL (qwen3-coder-30b)</text>
      <text x="820" y="593" class="node-role">Vision llava-next:13b · Fast-check granite-4.0-h-tiny</text>
      <text x="820" y="608" class="node-spec">Ollama Vulkan natif 11434 (OLLAMA_VULKAN=1)</text>
      <text x="820" y="623" class="node-spec">Pas de virtualisation · CPU AU REPOS pendant inférence</text>
      <text x="820" y="638" class="node-spec">VRAM dynamique 512 MB carve-out · BIOS P3.00+ patché</text>
    </g>

    <!-- Relay.json NFS shared M1↔M2 -->
    <g style="--node-color:#db2777;">
      <circle cx="595" cy="685" r="28" class="node-bg" fill="#fdf2f8"/>
      <text x="595" y="688" text-anchor="middle" class="node-title" style="--node-color:#db2777; font-size:11px;">📄</text>
      <text x="595" y="720" text-anchor="middle" class="node-spec" style="font-size:9px;">relay.json</text>
      <text x="595" y="732" text-anchor="middle" class="node-spec" style="font-size:9px;">TTL 300s · NFS M1↔M2</text>
    </g>

    <!-- Backbone connections (horizontal line with labels) -->
    <path d="M395 660L420 660" class="arrow" style="--arrow-color:#0ea5e9;"/>
    <polygon points="420,660 410,655 410,665" class="arrow-head" style="--arrow-color:#0ea5e9;"/>
    <text x="380" y="640" class="arrow-label" style="--arrow-color:#0ea5e9;">Qdrant 6333</text>

    <path d="M780 660L805 660" class="arrow" style="--arrow-color:#22c55e;"/>
    <polygon points="805,660 795,655 795,665" class="arrow-head" style="--arrow-color:#22c55e;"/>
    <text x="770" y="640" class="arrow-label" style="--arrow-color:#22c55e;">Ollama/Qdrant</text>

    <path d="M595 660L595 685" class="arrow" style="--arrow-color:#db2777; stroke-width:2;"/>
    <polygon points="595,685 590,675 600,675" class="arrow-head" style="--arrow-color:#db2777;"/>

    <!-- NFS mounts -->
    <path d="M395 685L420 685" class="arrow dashed" style="--arrow-color:#db2777;"/>
    <polygon points="420,685 410,680 410,690" class="arrow-head" style="--arrow-color:#db2777;"/>
    <text x="380" y="670" class="arrow-label" style="--arrow-color:#db2777;">TCP 2049</text>

    <path d="M780 685L805 685" class="arrow dashed" style="--arrow-color:#db2777;"/>
    <polygon points="805,685 795,680 795,690" class="arrow-head" style="--arrow-color:#db2777;"/>
    <text x="810" y="670" class="arrow-label" style="--arrow-color:#db2777;">TCP 2049</text>

    <!-- Ollama API horizontal -->
    <path d="M395 610L805 610" class="arrow dashed" style="--arrow-color:#0ea5e9;"/>
    <polygon points="805,610 795,605 795,615" class="arrow-head" style="--arrow-color:#0ea5e9;"/>
    <text x="550" y="590" class="arrow-label" style="--arrow-color:#0ea5e9;">Ollama 11434 (M2, M3)</text>
  </g>

  <!-- ========== Backup Cold Off-site (Bottom) ========== -->
  <g style="--vlan-color:#d97706;">
    <rect x="30" y="860" width="550" height="110" class="vlan-bg" rx="4"/>
    <text x="45" y="875" class="vlan-title">Backup Cold — Off-site (rotation physique)</text>

    <g style="--node-color:#d97706;">
      <rect x="60" y="900" width="490" height="55" class="node-bg" fill="#fffbeb" rx="4"/>
      <text x="75" y="915" class="node-title">💾 HDD 2 TB (LUKS, USB/SATA)</text>
      <text x="75" y="933" class="node-spec">borg (dédup, LZ4) · rsync configs · qdrant snapshot (cron quotidien) · Rétention 30j / 12m / 3y</text>
    </g>
  </g>

  <!-- Legend (Right bottom) -->
  <g transform="translate(620, 860)">
    <rect x="0" y="0" width="550" height="110" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1" rx="4"/>
    <text x="15" y="20" class="legend-title">Légende</text>

    <g transform="translate(15, 35)">
      <rect x="0" y="0" width="14" height="14" class="legend-swatch" style="--swatch-color:#2563eb;" rx="2"/>
      <text x="20" y="11" class="legend-item">Frontend / Entrées-Sorties — Client Obsidian (VLAN 40)</text>

      <rect x="0" y="24" width="14" height="14" class="legend-swatch" style="--swatch-color:#0ea5e9;" rx="2"/>
      <text x="20" y="35" class="legend-item">Orchestration, API, VectorDB, Embedding CPU, Évaluateur, NFS — M1 Master</text>

      <rect x="0" y="48" width="14" height="14" class="legend-swatch" style="--swatch-color:#22c55e;" rx="2"/>
      <text x="20" y="59" class="legend-item">Reranker, Juge, Avocat, Backup Embedding CPU — M2 GPU Worker</text>

      <rect x="280" y="0" width="14" height="14" class="legend-swatch" style="--swatch-color:#f97316;" rx="2"/>
      <text x="300" y="11" class="legend-item">Générateur, Text-to-SQL, Vision, Fast-check — M3 BC-250 Baremetal</text>

      <rect x="280" y="24" width="14" height="14" class="legend-swatch" style="--swatch-color:#db2777;" rx="2"/>
      <text x="300" y="35" class="legend-item">relay.json (NFS partagé M1↔M2) — Évaluation séquentielle Juge→Avocat</text>

      <rect x="280" y="48" width="14" height="14" class="legend-swatch" style="--swatch-color:#d97706;" rx="2"/>
      <text x="300" y="59" class="legend-item">Backup Cold / Passerelle pfSense — Off-site, VLAN 20/30</text>
    </g>
  </g>

  <!-- Arrow convention -->
  <text x="30" y="890" class="subtitle" style="font-size:10px;">Conventions : ──▶ flux synchrone (API, NFS) · ┄┄▶ asynchrone/feedback (backup, relay) · ⬤ nœud · ⬜ zone VLAN</text>
</svg>