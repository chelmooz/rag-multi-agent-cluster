[project]
name = "rag-multi-agent-cluster"
version = "0.1.0-dev"
description = "Cluster RAG 100% Offline avec évaluation multi-agents (Juge + Avocat du diable + Évaluateur)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Projet JARVIS", email = "jarvis@example.com"}
]
keywords = ["rag", "llm", "multi-agent", "offline", "obsidian", "proxmox", "vulkan"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core API
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # HTTP Client avec retry/circuit-breaker
    "httpx>=0.27.0",
    "tenacity>=8.2.0",

    # Vector DB
    "qdrant-client>=1.10.0",

    # Database
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",

    # Cache/Queue
    "redis>=5.0.0",

    # LLM / Embeddings
    "ollama>=0.3.0",
    "langchain-core>=0.2.0",
    "langgraph>=0.1.0",

    # Text processing
    "tiktoken>=0.7.0",
    "markdown-it-py>=3.0.0",

    # Config / Secrets
    "python-dotenv>=1.0.0",

    # Observabilité
    "prometheus-client>=0.19.0",
    "structlog>=24.1.0",

    # Utils
    "pyyaml>=6.0.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "black>=24.3.0",
    "isort>=5.13.0",
]

docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]

bc250 = [
    # Dépendances spécifiques BC-250 (Vulkan, GPU monitoring)
    # Note: ollama avec backend Vulkan se configure via variable d'env OLLAMA_VULKAN=1
]

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E", "F", "I", "W", "UP", "B", "C4", "T20", "PIE", "PT", "Q", "RUF", "SIM", "TID", "TRY"
]
ignore = []
extend-ignore = ["S101"]  # assert in tests
fixable = ["ALL"]
unfixable = ["T20", "TRY"]
per-file-ignores = {
    "tests/*": ["S101", "ERA001"],
    "scripts/*": ["S101", "T201"],
}

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "src/main.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.pre-commit-hooks]
# Voir .pre-commit-config.yaml pour la config complète